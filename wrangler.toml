[[d1_databases]]
binding = "DB"
database_name = "snack-voting"
# Placeholder: local/test only. Replace with the real id from `wrangler d1 create`.
database_id = "00000000-0000-0000-0000-000000000000"

# ADMIN_PIN is a secret. Set it outside the repo with
