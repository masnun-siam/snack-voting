<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snack Voting</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#f6f6f4;color:#222}
    main{max-width:32rem;margin:0 auto;padding:1rem;display:grid;gap:1rem}
    section:empty,#status:empty{display:none}
    section,#status{background:#fff;border-radius:.5rem;padding:1rem;box-shadow:0 1px 2px #0002}
    #status.error{border-left:4px solid #c0392b}
    button{font:inherit;min-height:44px;padding:.5rem 1rem;border:1px solid #bbb;border-radius:.5rem;background:#fff;cursor:pointer}
    .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.5rem;margin-top:.5rem}
    @media (min-width:40rem){main{padding:2rem 1rem}}
  </style>
</head>
<body>
  <main>
    <h1>Snack Voting</h1>
    <div id="status" role="status"></div>
    <section id="picker"></section>
    <section id="vote"></section>
    <section id="suggest"></section>
    <section id="history"></section>
  </main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
